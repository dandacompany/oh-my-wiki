# Baseline every page type extends. Override per-type or per-vault.
required_fields: [title, date, type, tags]
field_types:
  tags: list
  title: str
  date: str
  review: dict
  aliases: list
  source_raw: list
  # Written by omw itself; declared here so unknown_field stays quiet on our own output.
  summary: str # ingest.write_wiki_page → read by fts (scorer) + hot_cache
  relations: dict # page_ops/merge → read by links.relations() + valid_relations
  source_url: str # ingest.save_raw (carried onto imported pages)
required_sections: []
allowed_values:
  confidence: [high, medium, low]
  status: [draft, inbox, processed, raw, superseded, meta]
  visibility: [public, private]
