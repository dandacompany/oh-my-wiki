[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-wiki"
version = "2.44.0"
description = "Karpathy-style LLM Wiki skill with multi-vault sqlite registry and Socratic wizard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dandacompany" }]
keywords = ["wiki", "llm", "rag", "sqlite", "knowledge-base", "claude", "agent"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.scripts]
omw = "scripts.omw_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-rerunfailures>=14",
    "ruff>=0.6",
]
wizard = ["questionary>=2.0"]
embedding = ["sqlite-vec>=0.1", "openai>=1.0"]
local-embedding = ["fastembed>=0.3", "sqlite-vec>=0.1"]
korean = ["kiwipiepy>=0.20"]
ocr = ["pytesseract>=0.3", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.setuptools.package-data]
# db/*.sql is source-tree package-data (needs a glob); scripts/_bundle/ is
# injected into the build by setup.py's build_py, so it needs no glob here.
"scripts" = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m 'not packaging'"
markers = [
    "integration: end-to-end tests that require tmux and fake backends",
    "flaky: known-flaky test (auto-reruns via pytest-rerunfailures)",
    "packaging: builds a wheel (slow); run explicitly with -m packaging",
]

[tool.ruff]
line-length = 100
target-version = "py310"
